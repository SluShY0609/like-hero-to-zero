<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Like Hero To Zero</title>
</head>
<body>
<h1>Like Hero To Zero</h1>
<p>Wähle ein Land aus, um den aktuellsten CO₂-Ausstoß zu sehen.</p>

<form th:action="@{/emission}" method="get">
    <label for="iso">Land:</label>
    <select id="iso" name="iso">
        <option th:each="c : ${countries}"
                th:value="${c.isoCode}"
                th:text="${c.name}"></option>
    </select>
    <button type="submit">Aktuellsten Wert anzeigen</button>
</form>

<hr/>

<p><a th:href="@{/scientist/dashboard}">Zum Scientist-Backend (Login)</a></p>
</body>
</html>
