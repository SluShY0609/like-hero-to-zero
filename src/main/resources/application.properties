# H2 Datenbank (persistiert als Datei im Projektordner)
spring.datasource.url=jdbc:h2:file:./data/likeherotozero;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf (praktisch während Entwicklung)
spring.thymeleaf.cache=false
spring.application.name=like-hero-to-zero
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
